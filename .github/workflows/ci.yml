name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_heavy:
        description: Run heavy plugin builds for manual dispatch
        required: false
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: EsionHsrahLatigid/juce-ci/.github/workflows/plugin-ci.yml@6182ac7554be6df6dee46d1e75eb097fde97abaf
    permissions:
      contents: read
    with:
      product_name: FoldKnife
      product_slug: foldknife
      cmake_option_prefix: FOLDKNIFE
      debug_targets_json: '["foldknife_dsp_tests"]'
      release_test_targets_json: '["foldknife_dsp_tests","foldknife_plugin_tests","foldknife_editor_tests"]'
      windows_debug_plugins: false
